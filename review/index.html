<!-- Self-hosted fonts (faces declared in css/style.css). Preloaded so they are
     in flight before the stylesheet parses. crossorigin is required even
     same-origin: font fetches are CORS-mode, and without it the preload does
     not match the real request and the file is fetched twice. -->
<script>
/* Wait for the fonts before the entrance runs. Added by script only, so a
   visitor without JS is never affected, and released either when the fonts
   report ready or after a short fixed wait, whichever lands first, so a slow
   or failed font can only delay the hero, never hide it.

   There is also a floor. With the fonts cached the ready signal comes back
   almost instantly, so the page snapped straight in and the arrival read as
   two different experiences depending on whether you had been here before.
   Holding briefly either way makes it one deliberate entrance. */
(function(){try{
  var h=document.documentElement,t0=Date.now(),MIN=300;
  h.classList.add('fonts-pending');
  var go=function(){h.classList.remove('fonts-pending');};
  var hold=function(){setTimeout(go,Math.max(0,MIN-(Date.now()-t0)));};
  if(document.fonts&&document.fonts.ready&&document.fonts.ready.then){
    document.fonts.ready.then(hold).catch(hold);
    setTimeout(go,900);
  }else{hold();}
}catch(_){}})();
</script>
